<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicAI — Citizen Problem Platform</title>
    <meta name="description" content="CivicAI — an AI-assisted platform for citizens to report civic problems, get smart duplicates clustering, and connect to the right response teams." />
    <meta name="theme-color" content="#3f37c9" />
    <!-- favicons: C emblem (transparent), all sizes -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <script>
      /* Apply theme + saved text size before first paint (no flash of small text). */
      (function () {
        var root = document.documentElement;
        root.setAttribute('data-theme', 'light');
        try {
          var z = localStorage.getItem('civic_text_size_v2');
          root.setAttribute('data-size', z === 'm' || z === 'l' ? z : 's');
        } catch (e) {
          root.setAttribute('data-size', 's');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
