<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicAI — Citizen Problem Platform</title>
    <meta name="description" content="CivicAI — an AI-assisted platform for citizens to report civic problems, get smart duplicates clustering, and connect to the right response teams." />
    <meta name="theme-color" content="#4f46e5" />
    <!-- favicons: C emblem (transparent), all sizes -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <script>
      /* Apply saved theme before first paint (no flash of wrong theme). */
      (function () {
        try {
          var t = localStorage.getItem('civic_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
