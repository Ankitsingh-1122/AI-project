services:
  - type: web
    name: civic-ai-platform
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SEED_ON_START
        value: "true"
      - key: EMBEDDER
        value: "sentence"
